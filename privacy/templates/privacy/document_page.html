{% extends "base.html" %}
{% load wagtailcore_tags %}
{% block content %}
  <article class="privacy-page page-section">
    <header class="container privacy-page__header page-header">
      <h1 class="heading heading--h1">{{ page.title }}</h1>
    </header>
    {% if page.content %}
      <div class="container privacy-page__content stack-grid">
        {% for block in page.content %}
          <section class="privacy-page__block privacy-page__block--{{ block.block_type }}">
            {% include "components/streamfield_block.html" with block=block text_class="rich-content" %}
          </section>
        {% endfor %}
      </div>
    {% endif %}
  </article>
{% endblock %}
